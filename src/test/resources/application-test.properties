# Test configuration
# Tests use Testcontainers with @ServiceConnection, which automatically configures
# the datasource. These properties are only used as fallbacks for tests that don't
# use Testcontainers.

# Keycloak configuration for tests (not used in most tests)
spring.security.oauth2.client.registration.keycloak.client-id=marketplace
spring.security.oauth2.client.provider.keycloak.issuer-uri=http://localhost:8180/realms/havbruksbrukt

# Keycloak Admin API (disabled in tests)
app.keycloak-admin.enabled=false
