spring.application.name=prosjekt
server.port=8080
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}

vaadin.launch-browser=false
# Copilot er Vaadins innebygde AI-utviklerverktøy (uavhengig av GitHub Copilot).
# Deaktivert i denne demoen: gir en fullskjerms grå overlay ved klientfeil, som
# forstyrrer demo-testing uten å gi nyttig informasjon utover en vanlig konsollfeil.
vaadin.copilot.enable=false

spring.security.oauth2.client.registration.keycloak.client-id=${KEYCLOAK_CLIENT_ID:marketplace}
spring.security.oauth2.client.registration.keycloak.client-authentication-method=none
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.provider.keycloak.authorization-uri=${KEYCLOAK_AUTHORIZATION_URI:http://localhost:8180/realms/havbruksbrukt/protocol/openid-connect/auth}
spring.security.oauth2.client.provider.keycloak.token-uri=${KEYCLOAK_TOKEN_URI:http://localhost:8180/realms/havbruksbrukt/protocol/openid-connect/token}
spring.security.oauth2.client.provider.keycloak.user-info-uri=${KEYCLOAK_USER_INFO_URI:http://localhost:8180/realms/havbruksbrukt/protocol/openid-connect/userinfo}
spring.security.oauth2.client.provider.keycloak.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/havbruksbrukt/protocol/openid-connect/certs}
spring.security.oauth2.client.provider.keycloak.user-name-attribute=sub

app.keycloak-admin.enabled=${KEYCLOAK_ADMIN_ENABLED:false}
app.keycloak-admin.base-url=${KEYCLOAK_ADMIN_BASE_URL:}
app.keycloak-admin.realm=${KEYCLOAK_ADMIN_REALM:havbruksbrukt}
app.keycloak-admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID:marketplace-provisioner}
app.keycloak-admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET:}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/havbruksbrukt}
spring.datasource.username=${DATABASE_USERNAME:havbruksbrukt}
spring.datasource.password=${DATABASE_PASSWORD:havbruksbrukt}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true
spring.jpa.properties.hibernate.default_batch_fetch_size=50
