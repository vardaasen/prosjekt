<!doctype html>
<html lang="no" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">Utforsk utstyr</title>
  <meta name="description" th:content="${description}">
  <meta name="robots" th:content="${robots}">
  <link rel="canonical" th:href="${canonicalUrl}">
  <link rel="stylesheet" href="/styles/site.css">
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<main class="shell">
  <h1>Utforsk brukt akvakulturutstyr</h1>
  <form class="filters" method="get" action="/utstyr">
    <label>
      Søk
      <input type="search" name="q" th:value="${query}" placeholder="Søk etter utstyr">
    </label>
    <label>
      Lokasjon
      <input type="text" name="lokasjon" th:value="${location}" placeholder="For eksempel Trøndelag">
    </label>
    <label>
      Tilstand
      <select name="tilstand">
        <option value="">Alle</option>
        <option value="GOOD" th:selected="${condition == 'GOOD'}">God stand</option>
        <option value="USED" th:selected="${condition == 'USED'}">Brukt</option>
        <option value="NEEDS_SERVICE" th:selected="${condition == 'NEEDS_SERVICE'}">Trenger service</option>
      </select>
    </label>
    <button class="button" type="submit">Filtrer</button>
  </form>
  <p class="result-status" role="status" th:text="${resultMessage}">3 annonser funnet.</p>
  <div class="cards">
    <article class="card" th:each="listing : ${listings}">
      <h2><a th:href="@{/utstyr/{slug}(slug=${listing.slug})}" th:text="${listing.title}">Annonse</a></h2>
      <p th:text="|${listing.location} · ${listing.condition.displayName()}|">Lokasjon · Tilstand</p>
      <p th:text="${listing.summary}">Beskrivelse</p>
      <p class="price" th:text="|kr ${#numbers.formatDecimal(listing.priceNok, 0, 'WHITESPACE', 0, 'COMMA')}|">kr 0</p>
    </article>
  </div>
</main>
</body>
</html>
