<!doctype html>
<html lang="no" xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="header" class="shell topbar">
  <a class="brand" href="/">Havbruksbrukt</a>
  <nav aria-label="Hovedmeny">
    <a th:each="link : ${navigation.links}" th:href="${link.href}" th:attr="aria-current=${link.current} ? 'page'" th:text="${link.label}">Utforsk utstyr</a>
    <a th:unless="${navigation.loggedIn}" href="/logg-inn" rel="nofollow">Logg inn</a>
    <form th:if="${navigation.loggedIn}" method="post" action="/logout">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <button class="link-button" type="submit">Logg ut</button>
    </form>
  </nav>
</header>
</body>
</html>
