services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: havbruksbrukt
      POSTGRES_USER: havbruksbrukt
      POSTGRES_PASSWORD: havbruksbrukt
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U havbruksbrukt -d havbruksbrukt"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
